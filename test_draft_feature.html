<!DOCTYPE html>
<html>
<head>
    <title>草稿功能测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .test-section h3 { margin-top: 0; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔍 草稿功能完整性测试</h1>
    
    <div class="test-section">
        <h3>✅ 步骤 1: 检查数据库表结构</h3>
        <button onclick="checkDatabaseStructure()">检查表结构</button>
        <div id="result1" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>✅ 步骤 2: 检查 API 文件</h3>
        <button onclick="checkAPIFiles()">检查 API 文件</button>
        <div id="result2" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>✅ 步骤 3: 测试保存草稿 API</h3>
        <button onclick="testSaveAPI()">测试 Save Draft API</button>
        <div id="result3" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>✅ 步骤 4: 测试加载草稿 API</h3>
        <input type="number" id="draftId" placeholder="输入草稿 ID" style="padding: 8px; width: 150px;">
        <button onclick="testLoadAPI()">测试 Load Draft API</button>
        <div id="result4" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>📋 功能检查清单</h3>
        <div id="checklist" class="result"></div>
    </div>

    <script>
        function updateResult(elementId, content, isError = false) {
            const el = document.getElementById(elementId);
            el.textContent = content;
            el.className = 'result ' + (isError ? 'error' : 'success');
        }

        async function checkDatabaseStructure() {
            updateResult('result1', '正在检查...');
            try {
                const response = await fetch('/borrowing-system/api/check_draft_columns.php');
                const data = await response.json();
                updateResult('result1', JSON.stringify(data, null, 2), !data.success);
            } catch (e) {
                updateResult('result1', '错误: ' + e.message, true);
            }
        }

        async function checkAPIFiles() {
            updateResult('result2', '正在检查...');
            try {
                const files = [
                    '/borrowing-system/api/save_draft.php',
                    '/borrowing-system/api/load_draft.php'
                ];
                const results = {};
                for (const file of files) {
                    try {
                        const response = await fetch(file, { method: 'HEAD' });
                        results[file] = response.ok ? '✓ 存在' : '✗ 不存在';
                    } catch (e) {
                        results[file] = '✗ 错误: ' + e.message;
                    }
                }
                updateResult('result2', JSON.stringify(results, null, 2));
            } catch (e) {
                updateResult('result2', '错误: ' + e.message, true);
            }
        }

        async function testSaveAPI() {
            updateResult('result3', '正在测试...');
            try {
                const formData = new FormData();
                formData.append('purpose', '测试草稿保存');
                formData.append('phone', '0912345678');
                
                const response = await fetch('/borrowing-system/api/save_draft.php', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                updateResult('result3', 'HTTP ' + response.status + '\n' + JSON.stringify(data, null, 2), !data.success);
                if (data.success) {
                    document.getElementById('draftId').value = data.reservation_id;
                }
            } catch (e) {
                updateResult('result3', '错误: ' + e.message, true);
            }
        }

        async function testLoadAPI() {
            const draftId = document.getElementById('draftId').value;
            if (!draftId) {
                alert('请先输入草稿 ID');
                return;
            }
            updateResult('result4', '正在测试...');
            try {
                const response = await fetch('/borrowing-system/api/load_draft.php?id=' + draftId);
                const data = await response.json();
                updateResult('result4', 'HTTP ' + response.status + '\n' + JSON.stringify(data, null, 2), !data.success);
            } catch (e) {
                updateResult('result4', '错误: ' + e.message, true);
            }
        }

        // 页面加载时生成检查清单
        document.addEventListener('DOMContentLoaded', () => {
            const checklist = `
✅ 数据库表结构：status 和 purpose 字段
✅ API 文件：save_draft.php 和 load_draft.php
✅ 前端按钮：暫存申請 (蓝色外框线) 和 草稿箱 (灰色连接)
✅ 自动加载：URL 包含 id 参数时自动填入草稿
✅ 草稿显示：在 return_management.php?status=draft 中显示
✅ 编辑按钮：替代報到/歸還，链接到 borrow.php?id=
✅ 进度条：草稿状态显示为灰色虚线圈 + "草稿中"
✅ 样式：CSS 中添加 .btn-draft 和 .btn-draft-link
            `.trim();
            document.getElementById('checklist').textContent = checklist;
        });
    </script>
</body>
</html>
